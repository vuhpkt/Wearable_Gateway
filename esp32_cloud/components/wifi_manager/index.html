<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cấu hình Wearable Gateway</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 360px;
        }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        p { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 600; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0 16px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus { border-color: #38bdf8; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Wearable Gateway</h2>
        <p>Cấu hình Wi-Fi kết nối ThingsBoard</p>
        <form action="/save" method="POST">
            <label for="ssid">Tên Wi-Fi (SSID):</label>
            <input type="text" id="ssid" name="ssid" required maxlength="32" placeholder="Ví dụ: WiFi_Nha_Toi">
            
            <label for="pass">Mật khẩu:</label>
            <input type="password" id="pass" name="pass" maxlength="64" placeholder="Nhập mật khẩu Wi-Fi">
            
            <button type="submit">Lưu & Khởi Động Lại</button>
        </form>
    </div>
</body>
</html>
